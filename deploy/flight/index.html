<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071827"><title>알려줘 · 제주→김포 취소표</title>
<style>:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#eef7ff;background:#071827}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:22px 15px 60px}h1{font-size:28px;margin:6px 0 8px}.ey{font-size:12px;font-weight:800;letter-spacing:.12em;color:#7db7ff}.lead,.muted{color:#9fb3c7;font-size:14px;line-height:1.55}.card{background:#0e2235;border:1px solid #1e3b54;border-radius:17px;padding:17px;margin:14px 0}.route{font-size:21px;font-weight:900}.arrow{color:#7db7ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#a9bbca;font-size:12px;margin:0 0 6px}.field input{width:100%;background:#081b2c;border:1px solid #294a65;border-radius:10px;padding:12px;color:#fff;font-size:16px}button{width:100%;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:850;background:#7db7ff;color:#061522;cursor:pointer;margin-top:10px}button.secondary{background:#1c3a52;color:#e6f2ff}.status{padding:12px;border-radius:11px;background:#091b2b;margin-top:11px;color:#b8c8d7;font-size:13px;line-height:1.5}.flight{padding:13px 0;border-bottom:1px solid #203b50}.flight:last-child{border:0}.top{display:flex;justify-content:space-between;gap:10px;font-weight:800}.price{color:#78e0b2}.small{font-size:12px;color:#97acbf;margin-top:5px}.alertitem{padding:13px 0;border-bottom:1px solid #203b50}.alertitem:last-child{border:0}.alerttime{font-size:11px;color:#8fa5b8;margin-top:5px}.ok{color:#78e0b2}.warn{color:#ffd17a}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app">
<div class="ey">알려줘 · 항공권 MVP</div><h1>제주 → 김포 취소표 알림</h1><p class="lead">선택한 날짜 범위에서 현재 구매 가능한 항공편을 확인하고, 이후 새 항공편이 다시 등장하면 푸시로 알려줍니다.</p>
<section class="card"><div class="route">제주 <span class="arrow">CJU → GMP</span> 김포</div><p class="muted">전 항공사 · 편도 · 직항 기준</p><div class="grid"><div class="field"><label>시작일</label><input id="start" type="date"></div><div class="field"><label>종료일 (최대 5일)</label><input id="end" type="date"></div><div class="field"><label>탑승 인원</label><input id="adults" type="number" min="1" max="9" value="1"></div></div><button id="search">현재 항공편 조회</button><button id="watch" class="secondary">푸시 감시 켜기</button><button id="stop" class="secondary">감시 끄기</button><div id="state" class="status">날짜를 선택해 조회하세요.</div></section>
<section class="card"><b>현재 판매 가능 항공편</b><div id="results" class="muted" style="margin-top:8px">아직 조회하지 않았습니다.</div></section><section class="card"><b>최근 알림</b><div id="recentAlerts" class="muted" style="margin-top:8px">최근 알림을 불러오는 중입니다.</div></section>
<section class="card"><div class="muted">MVP 감시는 현재 1시간 간격입니다. 날짜 1일을 감시하면 하루 최대 약 24회 SerpApi 검색을 사용합니다. 날짜가 5일이면 약 120회/일입니다.</div></section></main>
<script>
const $=x=>document.getElementById(x);
const today=new Date(); today.setDate(today.getDate()+1); const iso=d=>d.toISOString().slice(0,10); $('start').value=iso(today); $('end').value=iso(today);
function money(n){return n?Number(n).toLocaleString('ko-KR')+'원':'가격 확인'}
function time(v){return String(v||'').includes(' ')?String(v).split(' ')[1]:String(v||'')}
function render(fs){$('results').innerHTML=fs.length?fs.map(f=>`<div class="flight"><div class="top"><span>${f.date} · ${time(f.departure)} → ${time(f.arrival)}</span><span class="price">${money(f.price)}</span></div><div class="small">${f.airline||''} ${f.flightNumber||''}</div></div>`).join(''):'조건에 맞는 판매 가능 직항편이 없습니다.'}
function fmtAlertTime(v){try{return new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return v||''}}
function renderAlerts(items){$('recentAlerts').innerHTML=items.length?items.map(a=>`<div class="alertitem"><div class="top"><span>${a.date} · ${time(a.departure)} → ${time(a.arrival)}</span><span class="price">${money(a.price)}</span></div><div class="small">${a.airline||''} ${a.flightNumber||''}</div><div class="alerttime">감지 ${fmtAlertTime(a.detectedAt)}</div></div>`).join(''):'아직 발송된 알림 기록이 없습니다.'}
async function loadAlerts(){const r=await fetch('/api/flight-alert-history?t='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok){$('recentAlerts').textContent=j.error||'최근 알림 조회 실패';return}renderAlerts(j.alerts||[])}
let lastAlertRefresh=0;
async function refreshAlertsOnResume(){const now=Date.now();if(now-lastAlertRefresh<1500)return;lastAlertRefresh=now;await loadAlerts().catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAlertsOnResume()});
window.addEventListener('focus',refreshAlertsOnResume);
window.addEventListener('pageshow',refreshAlertsOnResume);
if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='refresh-alert-history')refreshAlertsOnResume()});
async function doSearch(){const s=$('start').value,e=$('end').value,a=$('adults').value;$('state').textContent='SerpApi에서 항공편을 조회 중입니다…';const r=await fetch(`/api/flight-search?start=${encodeURIComponent(s)}&end=${encodeURIComponent(e)}&adults=${a}`),j=await r.json();if(!r.ok){$('state').innerHTML='<span class="warn">'+(j.error||'조회 실패')+'</span>';return}$('state').innerHTML=`<span class="ok">조회 성공</span> · ${j.count}개 항공편`;render(j.flights)}
function b64(s){const p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(b);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function subscribe(){if(!('serviceWorker'in navigator)||!('PushManager'in window))throw Error('이 브라우저는 웹 푸시를 지원하지 않습니다.');const perm=await Notification.requestPermission();if(perm!=='granted')throw Error('알림 권한이 필요합니다.');const reg=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;const cfg=await (await fetch('/api/config')).json();if(!cfg.vapidPublicKey)throw Error('VAPID_PUBLIC_KEY가 설정되지 않았습니다.');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(cfg.vapidPublicKey)});return sub.toJSON()}
$('search').onclick=()=>doSearch().catch(e=>$('state').textContent=e.message);
$('watch').onclick=async()=>{try{$('state').textContent='푸시 감시를 등록 중입니다…';const subscription=await subscribe();const r=await fetch('/api/flight-watch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:$('start').value,end:$('end').value,adults:+$('adults').value,subscription})}),j=await r.json();if(!r.ok)throw Error(j.error||'등록 실패');$('state').innerHTML=`<span class="ok">감시 등록 완료</span> · 현재 ${j.count}편을 기준으로 저장했습니다. 새 항공편이 생기면 알림을 보냅니다.`;await doSearch()}catch(e){$('state').innerHTML='<span class="warn">'+e.message+'</span>'}};
$('stop').onclick=async()=>{await fetch('/api/flight-watch',{method:'DELETE'});$('state').textContent='감시를 껐습니다.'};
fetch('/api/flight-watch').then(r=>r.json()).then(j=>{if(j.enabled)$('state').innerHTML=`<span class="ok">감시 중</span> · ${j.start} ~ ${j.end} · ${j.adults}명`}).catch(()=>{});loadAlerts().catch(()=>{});
</script></body></html>
